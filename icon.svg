<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Outer radio wave arcs -->
  <path d="M132 148a168 168 0 0 0 0 216" fill="none" stroke="url(#wave)" stroke-width="22" stroke-linecap="round" opacity="0.5"/>
  <path d="M380 148a168 168 0 0 1 0 216" fill="none" stroke="url(#wave)" stroke-width="22" stroke-linecap="round" opacity="0.5"/>
  <!-- Inner radio wave arcs -->
  <path d="M174 186a108 108 0 0 0 0 140" fill="none" stroke="url(#wave)" stroke-width="22" stroke-linecap="round"/>
  <path d="M338 186a108 108 0 0 1 0 140" fill="none" stroke="url(#wave)" stroke-width="22" stroke-linecap="round"/>
  <!-- High-voltage "Watt" lightning bolt -->
  <path d="M278 124 L206 266 H258 L234 388 L314 238 H260 Z" fill="url(#bolt)" stroke="#fef3c7" stroke-width="6" stroke-linejoin="round"/>
</svg>
