<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Outer radio arcs -->
  <path d="M148 156a152 152 0 0 0 0 164" fill="none" stroke="url(#wave)" stroke-width="22" stroke-linecap="round" opacity="0.55"/>
  <path d="M364 156a152 152 0 0 1 0 164" fill="none" stroke="url(#wave)" stroke-width="22" stroke-linecap="round" opacity="0.55"/>
  <!-- Inner radio arcs -->
  <path d="M188 188a96 96 0 0 0 0 100" fill="none" stroke="url(#wave)" stroke-width="22" stroke-linecap="round"/>
  <path d="M324 188a96 96 0 0 1 0 100" fill="none" stroke="url(#wave)" stroke-width="22" stroke-linecap="round"/>
  <!-- Antenna mast & lattice -->
  <path d="M256 244 L204 404 M256 244 L308 404 M222 348 H290 M235 308 H277 M184 404 H328" fill="none" stroke="#e2e8f0" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Glowing transmitter beacon -->
  <circle cx="256" cy="238" r="28" fill="url(#gold)"/>
  <circle cx="256" cy="238" r="12" fill="#fef3c7"/>
</svg>
